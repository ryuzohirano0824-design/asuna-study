<style>
  html,body{margin:0;height:100%;background:#dcefff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#dcefff}
  .fallback{position:fixed;inset:auto 0 24px;text-align:center;font:600 14px -apple-system,sans-serif;color:#4a5a80;display:none}
  .fallback a{color:#2f74ff}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyoDlbnFXKyEW8mduL33QpYrK0zU1TzcmOjMjZCojOKZQJy1CLsK8Tu9bnHRyqxfRk/exec" allow="clipboard-write" title="あすなの勉強"></iframe>
<div class="fallback" id="fb">ひらかないときは <a href="https://script.google.com/macros/s/AKfycbyoDlbnFXKyEW8mduL33QpYrK0zU1TzcmOjMjZCojOKZQJy1CLsK8Tu9bnHRyqxfRk/exec">こちら</a></div>
<script>

</script>
